<title>Breathavia</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FAFAF8; color: #1A1A1A; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .container { text-align: center; padding: 40px 24px; max-width: 440px; }
  .logo { width: 80px; height: 80px; background: #2D7D7B; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 42px; font-weight: 700; color: #fff; }

  .btn { display: block; width: 100%; padding: 18px 24px; margin-bottom: 12px; border: 2px solid #2D7D7B; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.15s; text-align: center; }
  .btn-primary { background: #2D7D7B; color: #fff; }
  .btn-primary:hover { background: #1D5654; }
  .btn-secondary { background: #fff; color: #2D7D7B; }
  .btn-secondary:hover { background: #E8F4F3; }
  .footer { margin-top: 48px; font-size: 12px; color: #BBB; }
